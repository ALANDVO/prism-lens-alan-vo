services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: prism-lens-backend:dev
    container_name: prism-lens-backend
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      keycloak:
        condition: service_healthy
      db:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - backend-data:/app/data
    networks:
      - prism

  db:
    image: postgres:16-alpine
    container_name: prism-lens-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - prism

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: prism-lens-keycloak
    command: start-dev --import-realm
    env_file: .env
    environment:
      KC_DB: postgres
      KC_DB_URL: postgres://keycloak:keycloak@db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_HOSTNAME: localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/realms/master"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - prism

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: prism-lens-frontend:dev
    container_name: prism-lens-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - prism

volumes:
  backend-data:
  postgres-data:

networks:
  prism:
    driver: bridge