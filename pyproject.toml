[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "prism-lens-alan-vo"
version = "1.0.0"
description = "Diagnostic tool for Cursor plugins — validates plugin structure and explains loading failures."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Alan Vo", email = "alanvo@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Intended Audience :: Developers",
]

[project.urls]
Homepage = "https://github.com/ALANDVO/prism-lens-alan-vo"
Repository = "https://github.com/ALANDVO/prism-lens-alan-vo"

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend"]